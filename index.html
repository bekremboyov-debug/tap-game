<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; overflow: hidden; }
.header { padding: 20px; }
#score { font-size: 48px; font-weight: bold; margin: 10px 0; }
.coin-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
#coin { width: 200px; height: 200px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 50%; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4); display: flex; justify-content: center; align-items: center; font-size: 80px; cursor: pointer; }
#coin:active { transform: scale(0.92); }
.footer { padding: 20px; }
.energy-bar { width: 80%; max-width: 300px; height: 16px; background: #334155; border-radius: 8px; margin: 0 auto; overflow: hidden; }
.energy-fill { width: 100%; height: 100%; background: #22c55e; }
</style>
</head>
<body>
<div class="header"><div id="score">0</div><div>Ball</div></div>
<div class="coin-container"><div id="coin">🪙</div></div>
<div class="footer">
<div id="energyText" style="margin-bottom: 8px;">Energiya: 100 / 100</div>
<div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
</div>
<script>
let score = 0, energy = 100;
const scoreEl = document.getElementById('score'), coin = document.getElementById('coin'), energyText = document.getElementById('energyText'), energyFill = document.getElementById('energyFill');
coin.addEventListener('click', () => {
    if (energy > 0) {
        score++; energy--;
        scoreEl.innerText = score;
        energyText.innerText = `Energiya: ${energy} / 100`;
        energyFill.style.width = `${energy}%`;
        if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
    }
});
setInterval(() => { if (energy < 100) { energy++; energyText.innerText = `Energiya: ${energy} / 100`; energyFill.style.width = `${energy}%`; } }, 1000);
</script>
</body>
</html>
