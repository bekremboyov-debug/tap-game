:root {
  --bg-color: linear-gradient(135deg, #b91c1c 0%, #111827 60%, #030712 100%);
  --text-color: #fff;
  --header-text-color: #f59e0b;
  --card-bg: rgba(30, 41, 59, 0.85);
  --nav-bg: rgba(15, 23, 42, 0.98);
  --nav-text: #94a3b8;
  --nav-active: #f59e0b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-color); background-attachment: fixed; color: var(--text-color); font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; height: 100vh; overflow: hidden; }

/* EKRANLAR SOZLAMASI */
.screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: calc(100vh - 65px); padding: 15px 15px 20px 15px; overflow-y: auto; flex-direction: column; gap: 12px; text-align: left; }
.screen.active { display: flex; }

.header { padding: 10px; position: relative; text-align: center; margin-top: 5px; }
#score { font-size: 38px; font-weight: bold; margin: 2px 0; color: var(--header-text-color); text-shadow: 0 3px 6px rgba(0,0,0,0.8); }

/* STREAK KICHIK TUGMASI */
.streak-badge {
    position: absolute;
    top: 5px;
    right: 15px;
    background: rgba(245, 158, 11, 0.2);
    border: 1px solid #f59e0b;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: #f59e0b;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    backdrop-filter: blur(5px);
    z-index: 10;
}

#coin {

    height: 200px; 
    background: radial-gradient(circle, #1a0000 0%, #000000 80%); 
    border-radius: 50%; 
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9),

                inset 0 8px 15px rgba(255, 255, 255, 0.15), 
                inset 0 -10px 20px rgba(0, 0, 0, 0.9);

    justify-content: center; 
    align-items: center; 
    cursor: pointer;

    user-select: none; 
    overflow: hidden; 
    border: 5px solid #dc2626; 
    margin: auto;

#coin img { width: 100%; height: 100%; object-fit: cover; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.9)); }

.plus-one { position: absolute; font-size: 26px; font-weight: bold; color: #22c55e; text-shadow: 0 2px 4px rgba(0,0,0,0.9); pointer-events: none; animation: fly 0.8s ease-out; opacity: 0; }
@keyframes fly {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-70px); opacity: 0; }
}
