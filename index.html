<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Game</title>
<!-- Telegram Web App Skripti -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Supabase Kutubxonasi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-color: linear-gradient(135deg, #b91c1c 0%, #111827 60%, #030712 100%);
  --text-color: #fff;
  --header-text-color: #f59e0b;
  --card-bg: rgba(30, 41, 59, 0.85);
  --nav-bg: rgba(15, 23, 42, 0.95);
  --nav-text: #94a3b8;
  --nav-active: #f59e0b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-color); background-attachment: fixed; color: var(--text-color); font-family: Arial, sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; overflow: hidden; }

.screen { display: none; flex-direction: column; justify-content: space-between; height: 100%; padding: 20px; overflow-y: auto; }
.screen.active { display: flex; }

.header { padding: 10px; position: relative; }
#score { font-size: 42px; font-weight: bold; margin: 5px 0; color: var(--header-text-color); text-shadow: 0 3px 6px rgba(0,0,0,0.8); }

/* STREAK KICHIK TUGMASI */
.streak-badge {
    position: absolute;
    top: 10px;
    right: 20px;
    background: rgba(245, 158, 11, 0.2);
    border: 1px solid #f59e0b;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    color: #f59e0b;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* HAQIQIY 3D LOGO DIZAYNI */
.coin-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; position: relative; }
#coin { 
    width: 210px; 
    height: 210px; 
    background: radial-gradient(circle, #1a0000 0%, #000000 80%); 
    border-radius: 50%; 
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 
                0 0 30px rgba(239, 68, 68, 0.5), 
                inset 0 8px 15px rgba(255, 255, 255, 0.15), 
                inset 0 -10px 20px rgba(0, 0, 0, 0.9); 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    cursor: pointer; 
    transition: transform 0.1s ease; 
    user-select: none; 
    overflow: hidden; 
    border: 5px solid #dc2626; 
}
#coin:active { transform: scale(0.92); box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 4px 8px rgba(255,255,255,0.1); }
#coin img { width: 100%; height: 100%; object-fit: cover; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.9)); }

.plus-one { position: absolute; font-size: 26px; font-weight: bold; color: #22c55e; text-shadow: 0 2px 4px rgba(0,0,0,0.9); pointer-events: none; animation: fly 0.8s ease-out; opacity: 0; }
@keyframes fly {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-70px); opacity: 0; }
}

.footer { padding: 10px; }
.energy-bar { width: 100%; max-width: 300px; height: 14px; background: rgba(15, 23, 42, 0.9); border-radius: 7px; margin: 0 auto; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 2px 5px rgba(255,255,255,0.1); }
.energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #16a34a, #22c55e); transition: width 0.3s; }

.nav-bar { display: flex; justify-content: space-around; background: var(--nav-bg); backdrop-filter: blur(10px); padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); }
.nav-item { background: none; border: none; color: var(--nav-text); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nav-item.active { color: var(--nav-active); }
.nav-item span { font-size: 18px; }

.section-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: var(--header-text-color); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.card { background: var(--card-bg); backdrop-filter: blur(5px); padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.card-info h4 { margin: 0 0 5px 0; font-size: 16px; color: var(--text-color); }
.card-info p { margin: 0; font-size: 12px; color: #94a3b8; }
.upgrade-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }
.upgrade-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
.claim-btn { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.claim-btn:disabled { background: #475569; cursor: not-allowed; }

/* PROMO KOD INPUT DIZAYNI */
.promo-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15,23,42,0.8); color: #fff; font-size: 14px; margin-bottom: 10px; outline: none; }
.promo-input:focus { border-color: #f59e0b; }
</style>
</head>
<body>

<!-- 1. O'YIN EKRANI -->
<div id="game-screen" class="screen active">
    <div class="header">
        <div class="streak-badge" onclick="openStreakModal()">
            🔥 <span id="streakCount">1</span> kun
        </div>
        <div id="score">0</div>
        <div id="user-info" style="color: #94a3b8;">Yuklanmoqda...</div>
    </div>
    <div class="coin-container">
        <div id="coin">
            <img src="https://i.ibb.co/6010R2C7/7987.jpg" alt="Logo" onerror="this.src='https://i.imgur.com/8qQ3298.jpg'" />
        </div>
    </div>
    <div class="footer">
        <div id="energyText" style="margin-bottom: 6px; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);">Energiya: 100 / 100</div>
        <div class="energy-bar"><div id="energyFill" class="energy-fill"></div></div>
    </div>
</div>

<!-- 2. BOOST BO'LIMI -->
<div id="boost-screen" class="screen">
    <div class="section-title">⚡ Kuchaytirishlar</div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <div class="card">
            <div class="card-info">
                <h4>Ko'p bosish (+1 Tap)</h4>
                <p>Har bir bosishda qo'shiladigan coin: <span id="tapLevel">1</span></p>
            </div>
            <button class="upgrade-btn" id="tapUpgradeBtn" onclick="upgradeTap()">100 🪙</button>
        </div>
        <div class="card">
            <div class="card-info">
                <h4>Avto-Robot (Passive)</h4>
                <p>Har sekundda o'zi tanga yig'adi</p>
            </div>
            <button class="upgrade-btn" id="botUpgradeBtn" onclick="upgradeBot()">500 🪙</button>
        </div>
    </div>
    <div></div>
</div>

<div id="missions-screen"
